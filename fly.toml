# fly.toml app configuration file generated for poebattle on 2026-08-03T21:59:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'poebattle'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  PORT = '8787'
  SNAPSHOT_PATH = '/data/snapshot.json'

[[mounts]]
  source = 'exile_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

# fly.toml app configuration file generated for exile-draft on 2026-08-03T22:53:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "exile-draft"
primary_region = 'lax'

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "8787"
  SNAPSHOT_PATH = "/data/snapshot.json"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  checks = [{ grace_period = '10s', interval = '15s', method = 'GET', path = '/api/health', timeout = '5s' }]
  concurrency = { hard_limit = 250, soft_limit = 200, type = 'connections' }

# Optional: persist the in-memory store's snapshot between restarts when
# running without Postgres. Create with: fly volumes create exile_data --size 1

[mounts]
  source = "exile_data"
  destination = "/data"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

# Fly.io config — one app serving both the API/WebSockets and the built web
# client from the same origin.
#
#   fly launch --copy-config --no-deploy   # first time (pick a unique app name)
#   fly postgres create && fly postgres attach <pg-app>   # sets DATABASE_URL
#   fly deploy
#
# Without an attached Postgres the server falls back to the in-memory
# snapshot store; mount a volume at /data if you want that snapshot to
# survive restarts (see [mounts] below).

app = "exile-draft"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "8787"
  SNAPSHOT_PATH = "/data/snapshot.json"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

# Optional: persist the in-memory store's snapshot between restarts when
# running without Postgres. Create with: fly volumes create exile_data --size 1
[mounts]
  source = "exile_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

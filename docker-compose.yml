services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exile
      POSTGRES_PASSWORD: exile
      POSTGRES_DB: exiledraft
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exile"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://exile:exile@db:5432/exiledraft
      PORT: "8787"
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:8787
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata:
